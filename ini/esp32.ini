#
# Marlin Firmware
# PlatformIO Configuration File
#

#################################
#                               #
#      ESP32 Architecture       #
#                               #
#################################

#
# Espressif ESP32
#
[env:esp32]
platform         = espressif32@6.0.1
board            = esp32dev
build_flags      = ${common.build_flags} -DCORE_DEBUG_LEVEL=0
build_src_filter = ${common.default_src_filter} +<src/HAL/ESP32>
lib_ignore       = NativeEthernet
upload_speed = 921600
monitor_speed = 115200
monitor_port = COM6
upload_port = COM6
monitor_filters  = colorize, time, send_on_enter, log2file, esp32_exception_decoder
#upload_port     = marlinesp.local
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

[env:FYSETC_E4]
extends                = env:esp32
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

[env:PANDA]
extends                = env:esp32
build_flags            = ${env:esp32.build_flags} -DUSE_ESP32_EXIO -DUSE_ESP32_TASK_WDT
lib_deps               = ${common.lib_deps}
                         SoftwareSerialEsp32
board_build.partitions = Marlin/src/HAL/ESP32/esp32.csv
upload_speed           = 115200
monitor_speed          = 115200

[env:mks_tinybee]
extends                = env:esp32
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
lib_deps                = ${common.lib_deps}
                          AsyncTCP
                          marvinroger/AsyncMqttClient @ ^0.9.0
